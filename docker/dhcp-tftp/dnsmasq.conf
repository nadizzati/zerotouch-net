# dnsmasq configuration for the zerotouch-net simulation (stage 1).
# This container provides DHCP and TFTP only. DNS is disabled.

# Run in the foreground and send logs to stderr so "docker compose logs" shows them.
keep-in-foreground
log-facility=-
# Log every DHCP exchange, including the options sent and received.
log-dhcp

# Disable the DNS function entirely.
port=0

interface=eth0
bind-interfaces

# DHCP pool for new devices. Static infrastructure addresses (.2 - .4) and
# the Docker IPAM range (.16/28) are outside this range.
dhcp-range=172.28.10.100,172.28.10.200,255.255.255.0,12h
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Default gateway handed to clients (the Docker bridge gateway).
dhcp-option=option:router,172.28.10.1

# Option 66: TFTP server name. Option 67: boot file name.
# The values are quoted so that dnsmasq encodes them as strings, not as an IPv4 address.
dhcp-option=66,"172.28.10.2"
dhcp-option=67,"bootstrap.sh"

# TFTP server. The root directory is mounted read-only from provisioning/tftp.
enable-tftp
tftp-root=/srv/tftp
